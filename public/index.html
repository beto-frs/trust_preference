<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9f4" />
    <title>Centro de Preferencias · Salcobrand</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="content-card">
        <form id="rut-form" novalidate>
          <label for="rut">RUT</label>
          <div class="input-row">
            <div class="input-wrap"><span class="input-prefix">ID</span><input id="rut" name="rut" type="text" autocomplete="off" placeholder="Ej.: 12.345.678-9" required aria-describedby="rut-hint form-message" maxlength="16" /></div>
            <button id="submit-button" type="submit"><span class="button-copy">Continuar</span><span class="button-arrow" aria-hidden="true">→</span></button>
          </div>
          <div class="form-meta"><span id="rut-hint">Use el RUT asociado a su cuenta.</span><span class="lock-note"><span>▣</span> Conexión protegida</span></div>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <div id="result" class="result" hidden>
          <div class="result-head"><span class="success-icon">✓</span><div><strong>Su enlace está listo</strong><span>Acceda ahora a su centro de preferencias.</span></div></div>
          <a id="preference-link" class="preference-link" href="#" target="_blank" rel="noopener noreferrer"><span>Abrir centro de preferencias</span><span aria-hidden="true">↗</span></a>
          <a id="trust-center-link" class="preference-link" href="#" target="_blank" rel="noopener noreferrer"><span>Abrir Centro de Confianza</span><span aria-hidden="true">↗</span></a>
          <p class="expiry-note" id="expiry-note">Por seguridad, este enlace es personal y de un solo uso.</p>
        </div>
      </section>

    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
